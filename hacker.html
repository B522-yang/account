<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Scan</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:black;
  color:#00ff00;
  font-family:monospace;
}
.box{
  text-align:center;
  border:2px solid #00ff00;
  padding:30px;
  width:400px;
  box-shadow:0 0 20px #00ff00;
}
.bar{
  height:20px;
  background:#003300;
  margin-top:20px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:0%;
  background:#00ff00;
  transition:width .3s;
}
.warning{
  color:red;
  font-size:20px;
  display:none;
  margin-top:20px;
}
</style>
</head>
<body>

<div class="box">
  <h2>Scaning your phone ...</h2>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="percent">0%</p>
  <div class="warning" id="warn">⚠  Your acount has been hacked ⚠</div>
</div>

<script>
let p=0;
let bar=document.getElementById("fill");
let text=document.getElementById("percent");
let warn=document.getElementById("warn");

let interval=setInterval(()=>{
  p+=Math.floor(Math.random()*8)+1;
  if(p>=100){
    p=100;
    clearInterval(interval);
    warn.style.display="block";

    setTimeout(()=>{
      alert("ITS A PRANK HAHA😂!");
      location.reload();
    },4000);
  }
  bar.style.width=p+"%";
  text.textContent=p+"%";
},300);
</script>

</body>
</html>
